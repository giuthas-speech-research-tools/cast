[project]
name = "computer-assisted-segmentation-tools"
version = "0.2.0"
description = "CAST - Computer Assisted Segmentation Tools"
authors = [
    { name = "Pertti Palo", email = "giuthas@gmail.com" }
]
license = "GPL-3.0"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "click>=8.1.8",
    "icecream>=2.1.3",
    "matplotlib>=3.10.0",
    "numpy>=2.2.1",
    "praat-textgrids>=1.4.0",
    "pydantic>=2.10.4",
    "pylint>=3.3.3",
    "scipy>=1.15.0",
    "strictyaml>=1.7.3",
]

[project.scripts]
cast = "cast:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
packages = ["src/cast"]

[tool.hatch.build.targets.wheel]
packages = ["src/cast"]

